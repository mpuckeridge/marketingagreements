<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Agreements</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<style>
  :root {
    --bg: #f5f2ec;
    --surface: #ffffff;
    --surface2: #f0ece4;
    --ink: #1a1714;
    --ink2: #6b6560;
    --ink3: #a09a94;
    --accent: #c8602a;
    --accent-light: #f5e8e0;
    --accent-dark: #9e4820;
    --border: rgba(26,23,20,0.1);
    --border2: rgba(26,23,20,0.18);
    --radius: 12px;
    --radius-sm: 7px;
    --shadow: 0 2px 12px rgba(26,23,20,0.07);
    --shadow-lg: 0 8px 40px rgba(26,23,20,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 15px; }

  .topbar { background: var(--ink); color: #fff; padding: 0 2.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .topbar-brand { font-family: 'DM Serif Display', serif; font-size: 18px; color: #fff; display: flex; align-items: center; gap: 10px; }
  .topbar-brand span { color: var(--accent); font-style: italic; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .status-pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: rgba(255,255,255,0.8); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #5cb85c; flex-shrink: 0; transition: background 0.3s; }
  .dot.syncing { background: #f0ad4e; animation: pulse 1s infinite; }
  .dot.error { background: #d9534f; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .btn-add { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 8px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s, transform 0.1s; }
  .btn-add:hover { background: var(--accent-dark); }
  .btn-add:active { transform: scale(0.97); }
  .sheet-link { color: rgba(255,255,255,0.7); font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 4px; }
  .sheet-link:hover { color: #fff; }

  .main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 2rem; }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; box-shadow: var(--shadow); }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink3); margin-bottom: 6px; }
  .stat-val { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--ink); line-height: 1; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .section-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); }
  .section-count { font-size: 12px; color: var(--ink3); background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 3px 12px; }

  /* Business card */
  .biz-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; transition: box-shadow 0.2s; }
  .biz-card:hover { box-shadow: var(--shadow-lg); }
  .biz-header { padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .biz-left { display: flex; align-items: center; gap: 14px; }
  .biz-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-light); color: var(--accent); font-family: 'DM Serif Display', serif; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(200,96,42,0.2); }
  .biz-name { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--ink); }
  .biz-contact { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .biz-email { font-size: 12px; color: var(--ink3); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
  .biz-right { display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 11px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 3px 10px; color: var(--ink2); white-space: nowrap; }
  .btn-icon { background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 6px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background 0.15s; }
  .btn-icon:hover { background: var(--surface2); }
  .btn-icon.danger { color: #c0392b; border-color: rgba(180,50,30,0.25); }
  .btn-icon.danger:hover { background: #fff0ee; }

  /* Projects */
  .projects-area { border-top: 0.5px solid var(--border); background: var(--surface2); }
  .project-row { border-bottom: 0.5px solid var(--border); padding: 1rem 1.5rem 1rem 2rem; }
  .project-row:last-child { border-bottom: none; }
  .project-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .project-name-block { display: flex; align-items: center; gap: 10px; }
  .project-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
  .project-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .commission-tag { font-size: 11px; background: var(--accent-light); color: var(--accent); border: 0.5px solid rgba(200,96,42,0.25); border-radius: 20px; padding: 2px 10px; white-space: nowrap; margin-left: 8px; }
  .project-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .stages-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .stage-chip { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 12px; font-size: 12px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .stage-chip-num { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stage-chip-amt { font-weight: 500; color: var(--accent); }

  .add-project-btn { display: flex; align-items: center; gap: 6px; padding: 10px 1.5rem 10px 2rem; font-size: 13px; color: var(--ink3); cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; width: 100%; text-align: left; border-top: 0.5px dashed var(--border2); transition: color 0.15s, background 0.15s; }
  .add-project-btn:hover { color: var(--accent); background: var(--accent-light); }

  .empty { text-align: center; padding: 5rem 2rem; color: var(--ink3); }
  .empty i { font-size: 48px; margin-bottom: 1rem; display: block; }
  .empty p { font-size: 15px; margin-bottom: 1.5rem; }
  .loader { text-align: center; padding: 3rem; color: var(--ink3); font-size: 14px; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(26,23,20,0.5); backdrop-filter: blur(3px); z-index: 200; align-items: flex-start; justify-content: center; padding: 3rem 1rem; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; border: 0.5px solid var(--border2); animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .modal-header { padding: 1.5rem 1.5rem 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
  .modal-subtitle { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .btn-close { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink2); }
  .btn-close:hover { background: #ebe6de; }
  .modal-body { padding: 0 1.5rem 1.25rem; }
  .form-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink3); margin: 1rem 0 10px; padding-top: 1rem; border-top: 0.5px solid var(--border); }
  .form-section:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .form-group.no-mb { margin-bottom: 0; }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); }
  input[type=text], input[type=email] { border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); background: var(--bg); width: 100%; transition: border-color 0.15s, box-shadow 0.15s; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,96,42,0.12); }
  .stage-entry { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
  .stage-entry-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .stage-entry-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); font-weight: 500; }
  .btn-rm { background: none; border: none; color: var(--ink3); cursor: pointer; font-size: 16px; padding: 0; line-height: 1; transition: color 0.15s; }
  .btn-rm:hover { color: #c0392b; }
  .btn-add-stage { width: 100%; background: transparent; border: 0.5px dashed var(--border2); border-radius: var(--radius-sm); padding: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 0; transition: background 0.15s; }
  .btn-add-stage:hover { background: var(--surface2); }
  .modal-footer { border-top: 0.5px solid var(--border); padding: 1rem 1.5rem; display: flex; justify-content: flex-end; gap: 8px; background: var(--surface2); border-radius: 0 0 var(--radius) var(--radius); }
  .btn-cancel { background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); cursor: pointer; transition: background 0.15s; }
  .btn-cancel:hover { background: #ebe6de; }
  .btn-save { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 22px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: background 0.15s; }
  .btn-save:hover { background: var(--accent-dark); }
  .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

  @media (max-width: 640px) {
    .topbar { padding: 0 1rem; }
    .main { padding: 1.5rem 1rem; }
    .stats { grid-template-columns: 1fr 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .biz-right { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <i class="ti ti-file-certificate" style="font-size:20px;color:var(--accent);"></i>
    Marketing <span>Agreements</span>
  </div>
  <div class="topbar-right">
    <div class="status-pill">
      <span class="dot" id="dot"></span>
      <span id="status-txt">Loading…</span>
    </div>
    <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1ch3V3FTd5nsRmoBDBHtDjGcwZNb5R_M9WgLyqEjX7Sk" target="_blank">
      <i class="ti ti-table" style="font-size:14px;"></i> Sheet
    </a>
    <button class="btn-add" onclick="openBizModal()">
      <i class="ti ti-plus"></i> Add business
    </button>
  </div>
</div>

<div class="main">
  <div class="stats">
    <div class="stat"><div class="stat-label">Businesses</div><div class="stat-val" id="s-biz">—</div></div>
    <div class="stat"><div class="stat-label">Projects</div><div class="stat-val" id="s-proj">—</div></div>
    <div class="stat"><div class="stat-label">Total invoices</div><div class="stat-val" id="s-inv">—</div></div>
    <div class="stat"><div class="stat-label">Commission types</div><div class="stat-val" id="s-comm">—</div></div>
  </div>

  <div class="section-header">
    <div class="section-title">All agreements</div>
    <span class="section-count" id="count-label">—</span>
  </div>

  <div id="loader" class="loader"><i class="ti ti-loader" style="font-size:24px;"></i><br>Connecting to Google Sheets…</div>
  <div id="empty" class="empty" style="display:none;">
    <i class="ti ti-building-store"></i>
    <p>No businesses yet. Add your first one.</p>
    <button class="btn-add" onclick="openBizModal()" style="margin:0 auto;"><i class="ti ti-plus"></i> Add business</button>
  </div>
  <div id="biz-list"></div>
</div>

<!-- Business modal -->
<div class="overlay" id="biz-overlay" onclick="if(event.target===this)closeBizModal()">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="biz-modal-title">New business</div><div class="modal-subtitle">Company details & contact info</div></div>
      <button class="btn-close" onclick="closeBizModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group no-mb"><label>Business name</label><input type="text" id="b-name" placeholder="Acme Corp" /></div>
        <div class="form-group no-mb"><label>Key contact</label><input type="text" id="b-contact" placeholder="Jane Smith" /></div>
      </div>
      <div class="form-row" style="margin-top:14px;">
        <div class="form-group no-mb"><label>Role / title</label><input type="text" id="b-role" placeholder="Marketing Manager" /></div>
        <div class="form-group no-mb"><label>Invoicing email</label><input type="email" id="b-email" placeholder="billing@acme.com" /></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeBizModal()">Cancel</button>
      <button class="btn-save" id="biz-save-btn" onclick="saveBiz()"><i class="ti ti-device-floppy"></i> Save business</button>
    </div>
  </div>
</div>

<!-- Project modal -->
<div class="overlay" id="proj-overlay" onclick="if(event.target===this)closeProjModal()">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="proj-modal-title">New project</div><div class="modal-subtitle" id="proj-modal-sub"></div></div>
      <button class="btn-close" onclick="closeProjModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-section" style="border-top:none;margin-top:0;padding-top:0;">Project details</div>
      <div class="form-row">
        <div class="form-group no-mb"><label>Project name</label><input type="text" id="p-name" placeholder="e.g. Summer Campaign" /></div>
        <div class="form-group no-mb"><label>Commission type</label><input type="text" id="p-commission" placeholder="e.g. Referral fee" /></div>
      </div>
      <div class="form-section">Invoice stages</div>
      <div id="p-stages"></div>
      <button class="btn-add-stage" onclick="addStage()" style="margin-top:0;"><i class="ti ti-plus"></i> Add invoice stage</button>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeProjModal()">Cancel</button>
      <button class="btn-save" id="proj-save-btn" onclick="saveProj()"><i class="ti ti-device-floppy"></i> Save project</button>
    </div>
  </div>
</div>

<script>
const SHEET_ID = '1ch3V3FTd5nsRmoBDBHtDjGcwZNb5R_M9WgLyqEjX7Sk';
const API = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-20250514';

// Data: [{id, name, contact, role, email, projects:[{id, name, commission, stages:[{desc,amount}]}]}]
let businesses = [];
let editBizIdx = null;
let editProjBizIdx = null;
let editProjIdx = null;
let sc = 0;

function uid() { return Math.random().toString(36).slice(2,9); }
function initials(n) { return (n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

function setStatus(state, txt) {
  const d = document.getElementById('dot');
  d.className = 'dot' + (state==='syncing'?' syncing':state==='error'?' error':'');
  document.getElementById('status-txt').textContent = txt;
}

async function claude(prompt) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2000,
      system: 'You are a data assistant. Always respond with only valid JSON, no markdown fences, no explanation.',
      messages: [{ role: 'user', content: prompt }],
      mcp_servers: [{ type: 'url', url: 'https://drivemcp.googleapis.com/mcp/v1', name: 'gdrive' }]
    })
  });
  const d = await r.json();
  return d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
}

// Sheet format: one row per project
// Columns: Business Name | Key Contact | Role | Invoicing Email | Project Name | Commission Type | Inv1 Desc | Inv1 Amt | Inv2 Desc | Inv2 Amt | Inv3 Desc | Inv3 Amt | Inv4 Desc | Inv4 Amt

async function load() {
  setStatus('syncing','Loading…');
  try {
    const raw = await claude(
      `Read the Google Sheet with file ID "${SHEET_ID}" using Google Drive tools. ` +
      `Columns: Business Name, Key Contact, Role, Invoicing Email, Project Name, Commission Type, Invoice 1 Description, Invoice 1 Amount, Invoice 2 Description, Invoice 2 Amount, Invoice 3 Description, Invoice 3 Amount, Invoice 4 Description, Invoice 4 Amount. ` +
      `Return a JSON array where each element is a row (skip header): {business, contact, role, email, project, commission, stages:[{desc,amount}]}. ` +
      `If empty return [].`
    );
    const rows = JSON.parse(raw.replace(/```json|```/g,'').trim());
    // Group by business name
    const map = {};
    const order = [];
    for (const row of (Array.isArray(rows)?rows:[])) {
      const key = (row.business||'').toLowerCase().trim();
      if (!map[key]) {
        map[key] = { id: uid(), name: row.business||'', contact: row.contact||'', role: row.role||'', email: row.email||'', projects: [] };
        order.push(key);
      }
      if (row.project) {
        map[key].projects.push({ id: uid(), name: row.project||'', commission: row.commission||'', stages: row.stages||[] });
      }
    }
    businesses = order.map(k => map[k]);
    setStatus('ok','Synced');
  } catch(e) {
    businesses = [];
    setStatus('error','Load failed');
  }
  document.getElementById('loader').style.display = 'none';
  render();
}

async function push() {
  setStatus('syncing','Saving…');
  const hdr = 'Business Name,Key Contact,Role,Invoicing Email,Project Name,Commission Type,Invoice 1 Description,Invoice 1 Amount,Invoice 2 Description,Invoice 2 Amount,Invoice 3 Description,Invoice 3 Amount,Invoice 4 Description,Invoice 4 Amount';
  const rows = [];
  for (const b of businesses) {
    if (!b.projects.length) {
      // Business with no projects — still write one row
      rows.push([b.name, b.contact, b.role, b.email, '', '', '', '', '', '', '', '', '', ''].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
    } else {
      for (const p of b.projects) {
        const cols = [b.name, b.contact, b.role, b.email, p.name, p.commission];
        for (let i=0;i<4;i++) { cols.push(p.stages[i]?.desc||''); cols.push(p.stages[i]?.amount||''); }
        rows.push(cols.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(','));
      }
    }
  }
  const csv = [hdr, ...rows].join('\n');
  try {
    await claude(`Update Google Sheet ID "${SHEET_ID}" via Google Drive tools. Replace all content with this CSV:\n\n${csv}\n\nReturn {"ok":true}.`);
    setStatus('ok','Saved to sheet');
  } catch(e) { setStatus('error','Save failed'); }
}

function render() {
  const allProjects = businesses.flatMap(b=>b.projects);
  const allInvoices = allProjects.reduce((s,p)=>s+(p.stages||[]).length,0);
  const commTypes = new Set(allProjects.map(p=>p.commission).filter(Boolean)).size;
  document.getElementById('s-biz').textContent = businesses.length;
  document.getElementById('s-proj').textContent = allProjects.length;
  document.getElementById('s-inv').textContent = allInvoices;
  document.getElementById('s-comm').textContent = commTypes;
  document.getElementById('count-label').textContent = businesses.length + ' business' + (businesses.length!==1?'es':'');

  const empty = document.getElementById('empty');
  const list = document.getElementById('biz-list');
  if (!businesses.length) { empty.style.display='block'; list.innerHTML=''; return; }
  empty.style.display='none';

  list.innerHTML = businesses.map((b,bi) => `
    <div class="biz-card">
      <div class="biz-header">
        <div class="biz-left">
          <div class="biz-avatar">${initials(b.name)}</div>
          <div>
            <div class="biz-name">${b.name}</div>
            <div class="biz-contact">${b.contact}${b.role?' · '+b.role:''}</div>
            ${b.email?`<div class="biz-email"><i class="ti ti-mail" style="font-size:11px;"></i>${b.email}</div>`:''}
          </div>
        </div>
        <div class="biz-right">
          <span class="pill">${b.projects.length} project${b.projects.length!==1?'s':''}</span>
          <button class="btn-icon" onclick="openBizModal(${bi})"><i class="ti ti-edit" style="font-size:13px;"></i> Edit</button>
          <button class="btn-icon danger" onclick="delBiz(${bi})"><i class="ti ti-trash" style="font-size:13px;"></i></button>
        </div>
      </div>
      <div class="projects-area">
        ${b.projects.map((p,pi) => `
          <div class="project-row">
            <div class="project-top">
              <div class="project-name-block">
                <div class="project-dot"></div>
                <div>
                  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                    <span class="project-name">${p.name||'Unnamed project'}</span>
                    ${p.commission?`<span class="commission-tag">${p.commission}</span>`:''}
                  </div>
                  ${(p.stages||[]).length?`<div class="stages-list">
                    ${(p.stages||[]).map((s,si)=>`
                      <div class="stage-chip">
                        <div class="stage-chip-num">${si+1}</div>
                        <span>${s.desc||'—'}</span>
                        <span class="stage-chip-amt">${s.amount||''}</span>
                      </div>`).join('')}
                  </div>`:'<div style="font-size:12px;color:var(--ink3);margin-top:4px;">No invoice stages yet</div>'}
                </div>
              </div>
              <div class="project-actions">
                <button class="btn-icon" onclick="openProjModal(${bi},${pi})"><i class="ti ti-edit" style="font-size:12px;"></i> Edit</button>
                <button class="btn-icon danger" onclick="delProj(${bi},${pi})"><i class="ti ti-trash" style="font-size:12px;"></i></button>
              </div>
            </div>
          </div>`).join('')}
        <button class="add-project-btn" onclick="openProjModal(${bi})">
          <i class="ti ti-plus" style="font-size:14px;"></i> Add project to ${b.name}
        </button>
      </div>
    </div>`).join('');
}

// --- Business modal ---
function openBizModal(idx) {
  editBizIdx = idx !== undefined ? idx : null;
  if (editBizIdx !== null) {
    const b = businesses[editBizIdx];
    document.getElementById('biz-modal-title').textContent = 'Edit business';
    document.getElementById('b-name').value = b.name;
    document.getElementById('b-contact').value = b.contact;
    document.getElementById('b-role').value = b.role;
    document.getElementById('b-email').value = b.email;
  } else {
    document.getElementById('biz-modal-title').textContent = 'New business';
    ['b-name','b-contact','b-role','b-email'].forEach(id=>document.getElementById(id).value='');
  }
  document.getElementById('biz-overlay').classList.add('open');
}
function closeBizModal() { document.getElementById('biz-overlay').classList.remove('open'); editBizIdx=null; }
async function saveBiz() {
  const name = document.getElementById('b-name').value.trim();
  if (!name) { alert('Please enter a business name.'); return; }
  const btn = document.getElementById('biz-save-btn');
  btn.disabled=true; btn.textContent='Saving…';
  const obj = { id: editBizIdx!==null?businesses[editBizIdx].id:uid(), name, contact:document.getElementById('b-contact').value.trim(), role:document.getElementById('b-role').value.trim(), email:document.getElementById('b-email').value.trim(), projects: editBizIdx!==null?businesses[editBizIdx].projects:[] };
  if (editBizIdx!==null) businesses[editBizIdx]=obj; else businesses.push(obj);
  closeBizModal();
  render();
  await push();
  btn.disabled=false; btn.innerHTML='<i class="ti ti-device-floppy"></i> Save business';
}
async function delBiz(bi) {
  if (!confirm(`Remove ${businesses[bi].name} and all its projects?`)) return;
  businesses.splice(bi,1); render(); await push();
}

// --- Project modal ---
function openProjModal(bi, pi) {
  editProjBizIdx = bi;
  editProjIdx = pi !== undefined ? pi : null;
  sc = 0;
  document.getElementById('p-stages').innerHTML = '';
  const b = businesses[bi];
  document.getElementById('proj-modal-sub').textContent = b.name;
  if (editProjIdx !== null) {
    const p = b.projects[editProjIdx];
    document.getElementById('proj-modal-title').textContent = 'Edit project';
    document.getElementById('p-name').value = p.name||'';
    document.getElementById('p-commission').value = p.commission||'';
    (p.stages||[]).forEach(s=>addStage(s));
  } else {
    document.getElementById('proj-modal-title').textContent = 'New project';
    document.getElementById('p-name').value='';
    document.getElementById('p-commission').value='';
    addStage();
  }
  document.getElementById('proj-overlay').classList.add('open');
}
function closeProjModal() { document.getElementById('proj-overlay').classList.remove('open'); editProjBizIdx=null; editProjIdx=null; }

function addStage(data) {
  sc++;
  const n=sc;
  const div=document.createElement('div');
  div.className='stage-entry'; div.id='se-'+n;
  div.innerHTML=`
    <div class="stage-entry-hdr">
      <span class="stage-entry-lbl">Invoice ${n}</span>
      <button class="btn-rm" onclick="document.getElementById('se-${n}').remove()"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div><label style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);display:block;margin-bottom:4px;">Description</label>
        <input type="text" id="sd-${n}" placeholder="e.g. Project kickoff" value="${data?data.desc:''}" /></div>
      <div><label style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);display:block;margin-bottom:4px;">Amount</label>
        <input type="text" id="sa-${n}" placeholder="e.g. $2,500 or 50%" value="${data?data.amount:''}" /></div>
    </div>`;
  document.getElementById('p-stages').appendChild(div);
}
function getStages() {
  return Array.from(document.querySelectorAll('#p-stages .stage-entry'))
    .map(el=>{const n=el.id.replace('se-','');return{desc:document.getElementById('sd-'+n)?.value.trim()||'',amount:document.getElementById('sa-'+n)?.value.trim()||''};})
    .filter(s=>s.desc||s.amount);
}
async function saveProj() {
  const name = document.getElementById('p-name').value.trim();
  if (!name) { alert('Please enter a project name.'); return; }
  const btn = document.getElementById('proj-save-btn');
  btn.disabled=true; btn.textContent='Saving…';
  const obj = { id: editProjIdx!==null?businesses[editProjBizIdx].projects[editProjIdx].id:uid(), name, commission:document.getElementById('p-commission').value.trim(), stages:getStages() };
  if (editProjIdx!==null) businesses[editProjBizIdx].projects[editProjIdx]=obj;
  else businesses[editProjBizIdx].projects.push(obj);
  closeProjModal();
  render();
  await push();
  btn.disabled=false; btn.innerHTML='<i class="ti ti-device-floppy"></i> Save project';
}
async function delProj(bi,pi) {
  if (!confirm('Remove this project?')) return;
  businesses[bi].projects.splice(pi,1); render(); await push();
}

load();
</script>
</body>
</html>
